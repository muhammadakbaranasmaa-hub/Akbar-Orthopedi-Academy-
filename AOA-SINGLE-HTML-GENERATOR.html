const AOA_UPLOADED_QUESTION_JSON = [{"id":"BONE-CELL-001","category":"Bone Cells","difficulty":"UKMPPD","type":"MCQ","question":"Which bone cell is primarily responsible for bone matrix synthesis?","options":{"A":"Osteoclast","B":"Osteoblast","C":"Osteocyte","D":"Osteoprogenitor cell","E":"Chondrocyte"},"answer":"B","explanation_id":"Osteoblast merupakan sel pembentuk tulang yang mensintesis osteoid, termasuk kolagen tipe I dan protein matriks seperti osteocalcin serta osteonectin.","option_analysis":{"A":"Salah. Osteoclast merupakan sel utama yang melakukan bone resorption.","B":"Benar. Osteoblast bertanggung jawab terhadap sintesis osteoid dan pembentukan tulang.","C":"Salah. Osteocyte terutama berperan sebagai mechanosensor dan regulator bone remodeling.","D":"Salah. Osteoprogenitor cell merupakan precursor yang dapat berdiferensiasi menjadi osteoblast.","E":"Salah. Chondrocyte merupakan sel pembentuk cartilage."}},{"id":"BONE-CELL-002","category":"Bone Cells","difficulty":"UKMPPD","type":"MCQ","question":"Osteoblasts are primarily derived from which cell lineage?","options":{"A":"Hematopoietic stem cells","B":"Monocyte-macrophage lineage","C":"Mesenchymal stem cells","D":"T lymphocytes","E":"Neural crest cells"},"answer":"C","explanation_id":"Osteoblast berasal dari mesenchymal stem/progenitor cells yang berdiferensiasi menjadi osteoprogenitor kemudian osteoblast.","option_analysis":{"A":"Salah. Hematopoietic lineage terutama menghasilkan sel darah dan juga osteoclast.","B":"Salah. Monocyte-macrophage lineage merupakan asal osteoclast.","C":"Benar. Osteoblast berasal dari mesenchymal stem/progenitor cell lineage.","D":"Salah. T lymphocytes bukan precursor osteoblast.","E":"Salah. Neural crest cells bukan lineage utama osteoblast."}},{"id":"BONE-CELL-003","category":"Bone Cells","difficulty":"UKMPPD","type":"MCQ","question":"Which enzyme is characteristically produced by osteoblasts and commonly used as a marker of osteoblastic activity?","options":{"A":"Cathepsin K","B":"Alkaline phosphatase","C":"Carbonic anhydrase II","D":"Tartrate-resistant acid phosphatase","E":"Myeloperoxidase"},"answer":"B","explanation_id":"Alkaline phosphatase atau ALP merupakan salah satu marker penting aktivitas osteoblast dan berperan dalam proses mineralisasi tulang.","option_analysis":{"A":"Salah. Cathepsin K terutama berperan dalam degradasi matriks organik oleh osteoclast.","B":"Benar. Alkaline phosphatase merupakan marker penting aktivitas osteoblast dan mineralisasi.","C":"Salah. Carbonic anhydrase II berperan dalam proses acidification pada osteoclast.","D":"Salah. TRAP merupakan marker yang berkaitan dengan osteoclast.","E":"Salah. Myeloperoxidase merupakan enzim yang terutama berkaitan dengan leukocytes."}},{"id":"BONE-CELL-004","category":"Bone Cells","difficulty":"UKMPPD","type":"MCQ","question":"Which type of collagen is the major collagen component of bone matrix?","options":{"A":"Type I","B":"Type II","C":"Type III","D":"Type IV","E":"Type X"},"answer":"A","explanation_id":"Type I collagen merupakan komponen organik utama extracellular matrix tulang.","option_analysis":{"A":"Benar. Type I collagen merupakan collagen utama pada bone matrix.","B":"Salah. Type II collagen terutama ditemukan pada cartilage.","C":"Salah. Type III collagen terutama terdapat pada jaringan ikat tertentu dan bukan collagen utama tulang.","D":"Salah. Type IV collagen terutama merupakan komponen basement membrane.","E":"Salah. Type X collagen berkaitan dengan hypertrophic cartilage."}},{"id":"BONE-CELL-005","category":"Bone Cells","difficulty":"UKMPPD","type":"MCQ","question":"Which bone cell is primarily responsible for bone resorption?","options":{"A":"Osteoblast","B":"Osteocyte","C":"Osteoclast","D":"Osteoprogenitor cell","E":"Fibroblast"},"answer":"C","explanation_id":"Osteoclast merupakan sel multinuklear yang melakukan bone resorption dengan melarutkan mineral dan mendegradasi matriks organik tulang.","option_analysis":{"A":"Salah. Osteoblast bertanggung jawab terhadap bone formation.","B":"Salah. Osteocyte terutama berperan sebagai mechanosensor dan regulator remodeling.","C":"Benar. Osteoclast merupakan sel utama yang melakukan bone resorption.","D":"Salah. Osteoprogenitor merupakan precursor osteoblast.","E":"Salah. Fibroblast menghasilkan komponen jaringan ikat dan bukan sel utama bone resorption."}},{"id":"BONE-CELL-006","category":"Bone Cells","difficulty":"UKMPPD","type":"MCQ","question":"Osteoclasts are derived from which cell lineage?","options":{"A":"Mesenchymal stem cell","B":"Osteoblast lineage","C":"Monocyte-macrophage lineage","D":"Chondrocyte lineage","E":"Fibroblast lineage"},"answer":"C","explanation_id":"Osteoclast berasal dari hematopoietic monocyte-macrophage lineage, berbeda dengan osteoblast yang berasal dari mesenchymal lineage.","option_analysis":{"A":"Salah. Mesenchymal lineage terutama menghasilkan osteoblast.","B":"Salah. Osteoclast tidak berasal dari osteoblast.","C":"Benar. Osteoclast berasal dari hematopoietic monocyte-macrophage lineage.","D":"Salah. Osteoclast tidak berasal dari chondrocyte.","E":"Salah. Fibroblast bukan precursor osteoclast."}},{"id":"BONE-CELL-007","category":"Bone Remodeling","difficulty":"UKMPPD","type":"MCQ","question":"Which molecule is the principal osteoblast-derived signal that promotes osteoclast differentiation?","options":{"A":"Osteoprotegerin","B":"RANKL","C":"Osteocalcin","D":"Cathepsin K","E":"Alkaline phosphatase"},"answer":"B","explanation_id":"RANKL diekspresikan oleh osteoblast dan stromal cells dan berikatan dengan RANK pada osteoclast precursor untuk merangsang osteoclast differentiation.","option_analysis":{"A":"Salah. Osteoprotegerin menghambat osteoclastogenesis dengan bertindak sebagai decoy receptor.","B":"Benar. RANKL merupakan sinyal utama yang merangsang osteoclast differentiation melalui RANK.","C":"Salah. Osteocalcin merupakan protein matriks tulang yang diproduksi osteoblast.","D":"Salah. Cathepsin K merupakan protease osteoclast.","E":"Salah. Alkaline phosphatase merupakan marker dan mediator aktivitas osteoblast serta mineralisasi."}},{"id":"BONE-CELL-008","category":"Bone Remodeling","difficulty":"PPDS","type":"MCQ","question":"Osteoprotegerin (OPG) inhibits osteoclastogenesis primarily by:","options":{"A":"Activating RANK","B":"Activating osteoblast differentiation","C":"Binding RANKL as a decoy receptor","D":"Increasing cathepsin K activity","E":"Increasing hydrochloric acid secretion"},"answer":"C","explanation_id":"OPG merupakan decoy receptor untuk RANKL. OPG mengikat RANKL sehingga RANKL tidak dapat berikatan dengan RANK pada osteoclast precursor dan osteoclastogenesis terhambat.","option_analysis":{"A":"Salah. Aktivasi RANK oleh RANKL justru merangsang osteoclastogenesis.","B":"Salah. Fungsi utama OPG adalah menghambat RANKL, bukan mengaktivasi diferensiasi osteoblast.","C":"Benar. OPG berfungsi sebagai decoy receptor yang mengikat RANKL.","D":"Salah. Cathepsin K merupakan enzim proteolitik osteoclast.","E":"Salah. OPG tidak meningkatkan sekresi asam oleh osteoclast."}},{"id":"BONE-CELL-009","category":"Bone Remodeling","difficulty":"PPDS","type":"MCQ","question":"Which receptor on osteoclast precursor cells binds RANKL?","options":{"A":"RANK","B":"OPG","C":"PTH receptor","D":"Integrin alpha2beta1","E":"Vitamin D receptor"},"answer":"A","explanation_id":"RANK terdapat pada osteoclast precursor. Ikatan RANKL dengan RANK merupakan sinyal utama untuk osteoclast differentiation dan activation.","option_analysis":{"A":"Benar. RANK pada osteoclast precursor berikatan dengan RANKL.","B":"Salah. OPG merupakan decoy receptor untuk RANKL.","C":"Salah. PTH receptor bukan receptor utama untuk interaksi RANKL-RANK.","D":"Salah. Integrin berperan dalam attachment osteoclast terhadap bone matrix.","E":"Salah. Vitamin D receptor bukan receptor utama yang mengikat RANKL."}},{"id":"BONE-CELL-010","category":"Osteoclast Biology","difficulty":"PPDS","type":"MCQ","question":"Which structure of the osteoclast is directly involved in bone resorption?","options":{"A":"Golgi apparatus","B":"Ruffled border","C":"Nucleus","D":"Rough endoplasmic reticulum","E":"Nuclear membrane"},"answer":"B","explanation_id":"Ruffled border merupakan permukaan osteoclast yang berhadapan langsung dengan tulang dan menjadi lokasi utama sekresi proton serta enzim resorpsi.","option_analysis":{"A":"Salah. Golgi apparatus berperan dalam processing dan packaging protein.","B":"Benar. Ruffled border merupakan struktur khusus osteoclast yang berhubungan langsung dengan permukaan tulang.","C":"Salah. Nucleus mengatur aktivitas sel tetapi bukan lokasi langsung bone resorption.","D":"Salah. Rough ER berperan dalam sintesis protein.","E":"Salah. Nuclear membrane bukan lokasi langsung resorpsi tulang."}},{"id":"BONE-CELL-011","category":"Osteoclast Biology","difficulty":"PPDS","type":"MCQ","question":"Which enzyme plays an important role in degradation of the organic bone matrix by osteoclasts?","options":{"A":"Alkaline phosphatase","B":"Cathepsin K","C":"Lactate dehydrogenase","D":"Amylase","E":"Creatine kinase"},"answer":"B","explanation_id":"Cathepsin K merupakan proteolytic enzyme utama yang disekresikan osteoclast dan berperan penting dalam degradasi collagen-rich organic bone matrix.","option_analysis":{"A":"Salah. Alkaline phosphatase terutama berkaitan dengan osteoblast dan mineralisasi.","B":"Benar. Cathepsin K merupakan protease utama dalam degradasi matriks organik tulang.","C":"Salah. Lactate dehydrogenase berperan dalam metabolisme anaerobik.","D":"Salah. Amylase berperan dalam pencernaan karbohidrat.","E":"Salah. Creatine kinase terutama berkaitan dengan metabolisme energi otot."}},{"id":"BONE-CELL-012","category":"Osteoclast Biology","difficulty":"PPDS","type":"MCQ","question":"Which substance is primarily secreted by osteoclasts to dissolve the mineral component of bone?","options":{"A":"Hydrochloric acid","B":"Bicarbonate","C":"Alkaline phosphatase","D":"Collagen type II","E":"Osteocalcin"},"answer":"A","explanation_id":"Osteoclast mensekresikan hydrogen ions atau proton sehingga menciptakan lingkungan asam yang melarutkan komponen mineral tulang, terutama hydroxyapatite.","option_analysis":{"A":"Benar. Lingkungan asam yang dibentuk oleh proton membantu melarutkan mineral tulang.","B":"Salah. Bicarbonate bukan zat utama untuk melarutkan mineral tulang.","C":"Salah. Alkaline phosphatase terutama berkaitan dengan osteoblast.","D":"Salah. Collagen type II terutama merupakan komponen cartilage.","E":"Salah. Osteocalcin merupakan protein matriks yang diproduksi oleh osteoblast."}},{"id":"BONE-CELL-013","category":"Osteocyte","difficulty":"PPDS","type":"MCQ","question":"Which bone cell functions primarily as a mechanosensor within the bone matrix?","options":{"A":"Osteoblast","B":"Osteoclast","C":"Osteocyte","D":"Osteoprogenitor cell","E":"Chondroblast"},"answer":"C","explanation_id":"Osteocyte merupakan osteoblast yang telah terperangkap di dalam bone matrix. Osteocyte berperan sebagai mechanosensor dan membantu mengatur bone remodeling sebagai respons terhadap mechanical loading.","option_analysis":{"A":"Salah. Osteoblast terutama berfungsi membentuk osteoid.","B":"Salah. Osteoclast terutama berfungsi melakukan bone resorption.","C":"Benar. Osteocyte merupakan mechanosensor utama dalam jaringan tulang.","D":"Salah. Osteoprogenitor merupakan precursor osteoblast.","E":"Salah. Chondroblast merupakan sel pembentuk cartilage."}},{"id":"BONE-CELL-014","category":"Osteoblast Differentiation","difficulty":"PPDS","type":"MCQ","question":"Which transcription factor is particularly important for osteoblast differentiation?","options":{"A":"RUNX2","B":"RANK","C":"Cathepsin K","D":"NFATc1","E":"Carbonic anhydrase II"},"answer":"A","explanation_id":"RUNX2 merupakan transcription factor penting dalam osteoblast differentiation dan mengarahkan mesenchymal progenitor menuju osteoblast lineage.","option_analysis":{"A":"Benar. RUNX2 merupakan regulator transkripsi utama dalam osteoblast differentiation.","B":"Salah. RANK merupakan receptor pada osteoclast precursor.","C":"Salah. Cathepsin K merupakan protease osteoclast.","D":"Salah. NFATc1 penting dalam osteoclastogenesis, bukan regulator utama osteoblast differentiation.","E":"Salah. Carbonic anhydrase II berperan dalam acidification oleh osteoclast."}},{"id":"BONE-CELL-015","category":"Bone Remodeling","difficulty":"PPDS","type":"MCQ","question":"Which statement best describes the functional relationship between osteoblasts and osteoclasts in bone remodeling?","options":{"A":"Osteoblasts and osteoclasts function independently without molecular communication","B":"Osteoclasts directly differentiate from osteoblasts","C":"Osteoblasts regulate osteoclastogenesis through the RANKL/OPG system","D":"Osteoclasts stimulate osteoblast differentiation exclusively through cathepsin K","E":"Osteoblasts prevent all forms of bone resorption"},"answer":"C","explanation_id":"Osteoblast tidak hanya membentuk tulang tetapi juga mengatur aktivitas osteoclast melalui sistem RANKL-RANK-OPG. RANKL meningkatkan osteoclastogenesis, sedangkan OPG menghambat RANKL sebagai decoy receptor. Keseimbangan keduanya membantu mempertahankan bone remodeling dan homeostasis tulang.","option_analysis":{"A":"Salah. Osteoblast dan osteoclast berkomunikasi melalui berbagai sinyal molekuler.","B":"Salah. Osteoclast berasal dari hematopoietic monocyte-macrophage lineage, bukan osteoblast.","C":"Benar. Osteoblast mengatur osteoclastogenesis terutama melalui keseimbangan RANKL dan OPG.","D":"Salah. Cathepsin K terutama merupakan protease osteoclast dan bukan satu-satunya mediator osteoblast differentiation.","E":"Salah. Osteoblast tidak mencegah seluruh bone resorption karena remodeling normal membutuhkan koordinasi formation dan resorption."}}];
function bootstrapUploadedQuestions(){
 try{
  const topics=allTopics();
  const normalize=s=>String(s||"").toLowerCase().replace(/basic science|orthobullet|[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
  const singular=s=>normalize(s).replace(/\b(cells|matrices|bones|fractures|injuries)\b/g,m=>({cells:"cell",matrices:"matrix",bones:"bone",fractures:"fracture",injuries:"injury"}[m]||m));
  const score=(title,cat)=>{
   const a=singular(title),b=singular(cat); if(!a||!b)return 0;
   if(a===b)return 100;if(a.includes(b)||b.includes(a))return 85;
   const aa=new Set(a.split(" ")),bb=new Set(b.split(" "));
   return Math.round(([...aa].filter(x=>bb.has(x)).length/Math.max(aa.size,bb.size))*70);
  };
  const list=customQuestions();
  let changed=false;
  for(const item of AOA_UPLOADED_QUESTION_JSON){
   const ranked=topics.map(t=>({t,score:score(t.title,item.category)})).sort((a,b)=>b.score-a.score);
   const topic=ranked[0]&&ranked[0].score>=70?ranked[0].t:null;
   const letters=["A","B","C","D","E"],opts=item.options||{};
   const normalized={topicId:topic?topic.id:null,topic:topic?topic.title:String(item.category||""),q:String(item.question||""),o:letters.map(L=>String(opts[L]||"")),a:Math.max(0,letters.indexOf(String(item.answer||"").toUpperCase())),e:String(item.explanation_id||""),hy:"",sourceId:String(item.id||""),category:String(item.category||""),difficulty:String(item.difficulty||""),type:String(item.type||"MCQ"),optionAnalysis:item.option_analysis&&typeof item.option_analysis==="object"?item.option_analysis:{}};
   const existing=list.find(q=>q.sourceId===normalized.sourceId);
   if(existing){Object.assign(existing,normalized);changed=true}
   else{normalized.id=nextId([...QUESTIONS,...list]);list.push(normalized);changed=true}
  }
  if(changed)saveCustomQuestions(list);
 }catch(e){console.warn("AOA uploaded question bootstrap:",e)}
}

let mediaDBPromise=null;
function mediaDB(){
 if(mediaDBPromise)return mediaDBPromise;
 mediaDBPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open("AOA_Content_DB",1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("media"))req.result.createObjectStore("media")};
  req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
 });
 return mediaDBPromise;
}
async function saveMedia(key,file){
 const db=await mediaDB();
 return new Promise((resolve,reject)=>{const tx=db.transaction("media","readwrite");tx.objectStore("media").put(file,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})
}
async function getMedia(key){
 try{
  const db=await mediaDB();
  const stored=await new Promise((resolve,reject)=>{const tx=db.transaction("media","readonly");const req=tx.objectStore("media").get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});
  if(stored)return stored;
 }catch(e){console.warn("AOA media database unavailable; using embedded media",e)}
 try{
  const m=window.__AOA_EMBEDDED_PACKAGE__?.media?.[key];
  if(m?.data){const b=atob(m.data),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new File([a],m.name||key,{type:m.type||"application/octet-stream"})}
 }catch(e){console.warn("AOA embedded media read failed",e)}
 return null;
}
async function deleteMedia(key){

function applyLightboxTransform(){const img=document.getElementById("aoaLightboxImg"),lab=document.getElementById("aoaLightboxZoom");if(img)img.style.transform=`translate(${lightboxX}px,${lightboxY}px) scale(${lightboxZoom})`;if(lab)lab.textContent=Math.round(lightboxZoom*100)+"%"}
function openInfographicLightbox(src,title){if(!src)return;ensureLightbox();lightboxSrc=src;lightboxZoom=1;lightboxX=0;lightboxY=0;const d=document.getElementById("aoaLightbox"),img=document.getElementById("aoaLightboxImg");img.src=src;img.alt=title||"Infografis";d.classList.add("open");document.body.style.overflow="hidden";applyLightboxTransform()}
function closeInfographicLightbox(){const d=document.getElementById("aoaLightbox");if(d)d.classList.remove("open");document.body.style.overflow=""}
function lightboxZoomBy(delta){lightboxZoom=Math.min(4,Math.max(.5,Math.round((lightboxZoom+delta)*10)/10));applyLightboxTransform()}
function resetLightboxZoom(){lightboxZoom=1;lightboxX=0;lightboxY=0;applyLightboxTransform()}

function openTopic(id){state.selectedTopic=id;state.questionIndex=0;state.quizSubmitted=false;state.quizAnswer=null;state.quizOriginalAnswer=null;state.quizFinished=false;state.quizOrder={};state.quizResponses={};state.questionIndex=0;state.quizSubmitted=false;state.quizAnswer=null;go("topic");setTimeout(()=>loadTopicMedia(id),0)}
function shuffleArray(arr){
 const a=arr.slice();
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function getQuizOrder(qid){
 if(!state.quizOrder)state.quizOrder={};
 if(!state.quizOrder[qid])state.quizOrder[qid]=shuffleArray([0,1,2,3,4]);
 return state.quizOrder[qid];
}
function answerQuestion(qid,displayIndex){
 const q=allQuestions().find(x=>x.id===qid);
 if(!q||state.quizSubmitted)return;
 const order=getQuizOrder(qid);
 const originalIndex=order[displayIndex];
 state.quizAnswer=displayIndex;
 state.quizOriginalAnswer=originalIndex;
 state.quizSubmitted=true;
 if(!state.quizResponses)state.quizResponses={};
 state.quizResponses[qid]={displayIndex,originalIndex,correct:originalIndex===q.a};
 recordAnswer(qid,originalIndex===q.a);
 render();
}
function prevTopicQuestion(){
 if(state.questionIndex>0){
  state.questionIndex--;state.quizSubmitted=false;state.quizAnswer=null;state.quizOriginalAnswer=null;render()
 }
}
function nextTopicQuestion(){
 const qs=allQuestions().filter(x=>x.topic===allTopics().find(t=>t.id===state.selectedTopic).title);
 if(state.questionIndex<qs.length-1&&state.quizSubmitted){
  state.questionIndex++;state.quizSubmitted=false;state.quizAnswer=null;state.quizOriginalAnswer=null;render()
 }
}
function finishQuizReview(id){
 const t=allTopics().find(x=>x.id===id);
 const qs=allQuestions().filter(x=>x.topic===t?.title || x.topicId===id);
 if(t&&qs.length) saveCompletedQuizAttempt(t,qs,state.quizResponses||{});
 state.quizFinished=true;
 state.quizSubmitted=false;
 state.quizAnswer=null;
 render();
}
function restartTopicQuiz(id){
 state.questionIndex=0;
 state.quizSubmitted=false;
 state.quizAnswer=null;
 state.quizOriginalAnswer=null;
 state.quizFinished=false;
 state.quizOrder={};
 state.quizResponses={};
 render();
}
function finishTopic(id){setProgress(id,100);toast("Topic ditandai selesai.");go("review")}
function renderQuizReview(t,qs){
 const responses=state.quizResponses||{};
 let correct=0,answered=0;
 qs.forEach(q=>{if(responses[q.id]){answered++;if(responses[q.id].correct)correct++}});
 const pct=qs.length?Math.round(correct/qs.length*100):0;
 return `<div class="aoa-quiz-review">
  <div class="reader-part-head"><div class="part-letter">✓</div><div><div class="part-label">HASIL LATIHAN</div><h3>Review Jawaban & Pembahasan</h3></div></div>
  <div class="aoa-review-summary"><div class="aoa-review-stat"><b>${correct}/${qs.length}</b>Benar</div><div class="aoa-review-stat"><b>${answered}/${qs.length}</b>Dijawab</div><div class="aoa-review-stat"><b>${pct}%</b>Nilai</div></div>
  ${qs.map((q,idx)=>{
    const r=responses[q.id], order=getQuizOrder(q.id), userOriginal=r?r.originalIndex:null;
    const userLetter=userOriginal===null?"—":String.fromCharCode(65+userOriginal);
    const correctLetter=String.fromCharCode(65+q.a);
    const status=r&&r.correct?"correct":"wrong";
    const analysis=q.optionAnalysis&&Object.keys(q.optionAnalysis).length?`<div class="aoa-option-analysis"><b>Analisis setiap opsi</b>${["A","B","C","D","E"].map(L=>q.optionAnalysis[L]?`<div><b>${L}.</b> ${esc(q.optionAnalysis[L])}</div>`:"").join("")}</div>`:"";
    return `<div class="aoa-review-item ${status}">
      <b>${idx+1}. ${esc(q.q)}</b>
      <div class="aoa-review-answer" style="background:${r&&r.correct?'#F1FAF4':'#FFF4F4'}">
       Jawaban Anda: <b>${userLetter}${userOriginal===null?"":" — "+esc(q.o[userOriginal])}</b><br>
       Jawaban benar: <b>${correctLetter} — ${esc(q.o[q.a])}</b>
      </div>
      <div style="margin-top:9px;font-size:11px;line-height:1.55"><b>Pembahasan:</b><br>${esc(q.e||"Pembahasan belum tersedia.")}</div>
      ${analysis}
      ${q.hy?`<div style="margin-top:9px;font-size:11px"><b>High-yield:</b> ${esc(q.hy)}</div>`:""}
    </div>`
  }).join("")}
  <div class="aoa-review-actions"><button class="btn primary" onclick="restartTopicQuiz(${t.id})">↻ Ulangi Latihan</button><button class="btn secondary" onclick="finishTopic(${t.id})">✓ Selesai & Kembali ke Review</button></div>
 </div>`
}

function startExam(id){const e=EXAMS.find(x=>x.id===id);state.exam={...e};state.examIndex=0;state.examAnswers={};state.examEnd=Date.now()+e.minutes*60*1000;clearInterval(state.examTimer);state.examTimer=setInterval(()=>{if(Date.now()>=state.examEnd){clearInterval(state.examTimer);finishExam()}else{renderExamTimer()}},500);state.page="examrun";render()}

async function deleteTopic(id){
 const all=[...TOPICS,...customTopics()];
 const topic=all.find(t=>Number(t.id)===Number(id));
 if(!topic){toast("Subtopic tidak ditemukan.");return}
 const isBuiltIn=TOPICS.some(t=>Number(t.id)===Number(id));
 const qCount=allQuestions().filter(q=>q.topicId===id||q.topic===topic.title).length;
 const message=isBuiltIn
  ? `Subtopic "${topic.title}" adalah materi bawaan/sample.\\n\\nHapus dari daftar Review Orthobullet pada browser ini?\\n\\nMateri akan disembunyikan dari Student.`
  : `Hapus subtopic "${topic.title}"?\\n\\nSubtopic, infographic, video, bank soal (${qCount} soal), dan progress akan dihapus dari browser ini.\\n\\nTindakan ini tidak dapat dibatalkan.`;
 if(!confirm(message))return;

 if(isBuiltIn){
   const hidden=new Set(hiddenTopics()); hidden.add(Number(id));
   localStorage.setItem(HIDDEN_TOPICS_KEY,JSON.stringify([...hidden]));
 }else{
   saveCustomTopics(customTopics().filter(t=>t.id!==id));
   saveCustomQuestions(customQuestions().filter(q=>q.topicId!==id && q.topic!==topic.title));
   await deleteMedia("infographic_"+id);
   await deleteMedia("source_"+id);
   localStorage.removeItem("aoa_progress_"+id);
 }
 state.editingTopicId=null;
 state.editingQuestionId=null;
 state.questionFilterTopic=null;
 toast(isBuiltIn?"Subtopic bawaan berhasil disembunyikan dari Review Orthobullet.":"Subtopic berhasil dihapus.");
 render();
}

 render();
}

function normalizeImportedQuestion(item,topic){
 const options=item.options||{};
 const letters=["A","B","C","D","E"];
 const opts=letters.map(l=>String(options[l]??"").trim());
 if(!item.id)throw new Error("Setiap soal harus memiliki id.");
 if(!item.question)throw new Error(`Soal ${item.id}: field "question" kosong.`);
 if(opts.some(x=>!x))throw new Error(`Soal ${item.id}: options A-E harus lengkap.`);
 const answer=String(item.answer||"").trim().toUpperCase();
 if(!letters.includes(answer))throw new Error(`Soal ${item.id}: answer harus A, B, C, D, atau E.`);
 return {
   topicId:topic.id,
   topic:topic.title,
   q: String(item.question).trim(),
   o:opts,
   a:letters.indexOf(answer),
   e:String(item.explanation_id||"").trim(),
   hy:"",
   sourceId:String(item.id),
   category:String(item.category||"").trim(),
   difficulty:String(item.difficulty||"").trim(),
   type:String(item.type||"MCQ").trim(),

function importQuestionJSON(){
 const raw=document.getElementById("jsonQuestionInput")?.value.trim();
 const select=document.getElementById("jsonQuestionTopic");
 if(!raw||!select){toast("JSON dan subtopic wajib diisi.");return}
 let parsed;
 try{parsed=JSON.parse(raw)}catch(e){toast("JSON tidak valid. Pastikan format JSON benar.");return}
 const items=Array.isArray(parsed)?parsed:(Array.isArray(parsed.questions)?parsed.questions:null);
 if(!items){toast("Format harus berupa array soal atau object dengan field questions[].");return}
 if(!items.length){toast("Tidak ada soal dalam JSON.");return}

 const topics=allTopics();
 const norm=s=>String(s||"").toLowerCase().replace(/basic science|orthobullet|[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
 const singular=s=>norm(s).replace(/\b(cells|matrices|bones|fractures|injuries)\b/g,m=>({cells:"cell",matrices:"matrix",bones:"bone",fractures:"fracture",injuries:"injury"}[m]||m));
 const scoreMatch=(title,cat)=>{
   const a=singular(title),b=singular(cat);
   if(!a||!b)return 0;
   if(a===b)return 100;
   if(a.includes(b)||b.includes(a))return 85;
   const aa=new Set(a.split(" ")),bb=new Set(b.split(" "));
   const overlap=[...aa].filter(x=>bb.has(x)).length;
   return overlap?Math.round(overlap/Math.max(aa.size,bb.size)*70):0;
 };
 const categories=[...new Set(items.map(x=>String(x.category||"").trim()).filter(Boolean))];
 let topicId=Number(select.value), matchedTopic=null;
 if(categories.length===1){
   const ranked=topics.map(t=>({t,score:scoreMatch(t.title,categories[0])})).sort((a,b)=>b.score-a.score);
   if(ranked[0]&&ranked[0].score>=70){matchedTopic=ranked[0].t;topicId=matchedTopic.id;select.value=String(topicId);}
 }
 const topic=topics.find(t=>t.id===topicId);
 if(!topic){toast("Subtopic tujuan tidak ditemukan. Pilih subtopic secara manual.");return}

 const list=customQuestions();
 let added=0,updated=0;
 try{
   for(const item of items){
     const n=normalizeImportedQuestion(item,topic);
     const existing=list.find(q=>q.sourceId===n.sourceId);
     if(existing){Object.assign(existing,n);updated++}
     else{n.id=nextId([...QUESTIONS,...list]);list.push(n);added++}
   }
 }catch(err){toast(err.message);return}
 saveCustomQuestions(list);
 state.questionFilterTopic=topic.id;
 state.editingQuestionId=null;
 const result=document.getElementById("jsonImportResult");
 if(result)result.innerHTML=`<b>Import berhasil.</b> ${added} soal baru, ${updated} diperbarui → <b>${esc(topic.title)}</b>${matchedTopic?`<br><span style="color:var(--green)">✓ Subtopic otomatis terdeteksi dari category "${esc(categories[0])}".</span>`:""}`;
 toast(`Import selesai: ${added} baru, ${updated} diperbarui ke ${topic.title}.`);
 render();
}

 reader.onload=()=>{const el=document.getElementById("jsonQuestionInput");if(el)el.value=reader.result;};

}

function abToBase64(buffer){
 const bytes=new Uint8Array(buffer); let binary="";
 const chunk=0x8000;
 for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));
 return btoa(binary);
}
function base64ToBlob(b64,type){
 const binary=atob(b64), bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
 return new Blob([bytes],{type:type||"application/octet-stream"});
}
async function buildFullPackage(){
 const media={};
 for(const t of customTopics()){
   for(const key of ["infographic_"+t.id,"source_"+t.id]){
     const file=await getMedia(key);
     if(file){
       media[key]={name:file.name||key,type:file.type||"application/octet-stream",data:abToBase64(await file.arrayBuffer())};
     }
   }
 }
 const appData={};
 for(let i=0;i<localStorage.length;i++){
   const k=localStorage.key(i);
   if(k && k.startsWith("aoa_") && k!=="aoa_user") appData[k]=localStorage.getItem(k);
 }
 return {format:"AOA_FULL_CONTENT_PACKAGE",version:4,exportedAt:new Date().toISOString(),topics:customTopics(),questions:customQuestions(),hiddenTopics:hiddenTopics(),media,appData};
}

   const bootstrap=`<${"script"}>
window.__AOA_PORTABLE_PACKAGE__=${safe};
(function(){
 try{
  const p=window.__AOA_PORTABLE_PACKAGE__;
  if(p&&p.topics) localStorage.setItem("aoa_custom_topics_v1",JSON.stringify(p.topics));
  if(p&&p.questions) localStorage.setItem("aoa_custom_questions_v1",JSON.stringify(p.questions));

  if(p&&p.media){
   const req=indexedDB.open("AOA_Content_DB",1);
   req.onupgradeneeded=function(){if(!req.result.objectStoreNames.contains("media"))req.result.createObjectStore("media")};
   req.onsuccess=function(){
    const db=req.result, tx=db.transaction("media","readwrite"), store=tx.objectStore("media");
    Object.keys(p.media).forEach(function(k){
     const m=p.media[k], b=atob(m.data), a=new Uint8Array(b.length);
     for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
     store.put(new File([a],m.name||k,{type:m.type||"application/octet-stream"}),k);
    });
   };
  }
 }catch(e){console.error("AOA portable package import:",e)}
})();
<\/script>`;
   const doc=document.documentElement.outerHTML;
   const portable=doc.replace("</body>",bootstrap+"</body>");

   a.href=URL.createObjectURL(blob);
   a.download="AOA-Portable-Master.html";
   document.body.appendChild(a); a.click(); a.remove();
   setTimeout(()=>URL.revokeObjectURL(a.href),1500);
   toast("AOA Portable Master berhasil dibuat. Semua konten akan dibawa dalam 1 file HTML.");
 }catch(e){

 }
}

async function importFullPackage(input){
 const file=input.files?.[0]; if(!file)return;
 try{
  const pkg=JSON.parse(await file.text());
  if(pkg.format!=="AOA_FULL_CONTENT_PACKAGE"||!Array.isArray(pkg.topics)||!Array.isArray(pkg.questions))throw new Error("invalid package");
  saveCustomTopics(pkg.topics); saveCustomQuestions(pkg.questions);
  for(const [key,m] of Object.entries(pkg.media||{})){
    await saveMedia(key,new File([base64ToBlob(m.data,m.type)],m.name||key,{type:m.type||"application/octet-stream"}));
  }
  state.editingTopicId=null;state.editingQuestionId=null;state.questionFilterTopic=null;
  toast("Full Content Package berhasil diimport.");
  render();
 }catch(e){console.error(e);toast("Import gagal. Pastikan file adalah AOA Full Content Package.");}
}
